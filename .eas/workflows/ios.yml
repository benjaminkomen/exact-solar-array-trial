# Experimental: the Exact iOS app as one Expo Workflow, build then submit.
# No `on:` trigger, so it only runs by hand:
#   npx eas-cli@latest workflow:run .eas/workflows/ios.yml
# The build job uses the ios-exact profile in eas.json, which runs the custom
# build in .eas/build/ios-exact.yml (Exact's own script, an unsigned .ipa).
name: iOS (Exact)

jobs:
  build_ios:
    name: Build unsigned .ipa
    type: build
    params:
      platform: ios
      profile: ios-exact

  # Disabled: there are no signing credentials or App Store Connect record yet,
  # and the build makes an unsigned .ipa that App Store Connect would refuse.
  # To turn it on, sign in the custom build (EXACT_IDENTITY and EXACT_PROFILE
  # instead of --unsigned), add the App Store Connect app to eas.json's
  # submit profile, and delete the `if:` line.
  submit_ios:
    name: Submit to App Store Connect
    needs: [build_ios]
    if: ${{ never() }}
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
