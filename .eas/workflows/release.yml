# Experimental: build the iOS and Android apps in one EAS Workflow, then submit
# the iOS build to App Store Connect. No `on:` trigger, so it only runs by hand:
#   npx eas-cli@latest workflow:run .eas/workflows/release.yml
#
# Expo manages the build numbers (appVersionSource "remote" in eas.json). Both
# build profiles autoIncrement once per run, so the iOS buildNumber and the
# Android versionCode stay equal as long as every build of one platform has a
# build of the other beside it. They are two counters on EAS. If they drift
# (a build of one platform alone), realign them:
#   npx eas-cli@latest build:version:get -p ios -e ios-exact
#   npx eas-cli@latest build:version:set -p android -e android-exact
# Builds that must not raise it (local runs, trials) use the *-nobump profiles.
#
# Android has no submit job: Exact builds a debug-signed APK, and Google Play
# takes only an upload-signed bundle.
name: Release (Exact, iOS and Android)

jobs:
  build_ios:
    name: Build iOS (signed .ipa)
    type: build
    params:
      platform: ios
      profile: ios-exact

  build_android:
    name: Build Android (APK)
    type: build
    params:
      platform: android
      profile: android-exact

  # Uploads the iOS build to App Store Connect (app 6833494203, eas.json's
  # production submit profile) with the API key stored on EAS.
  submit_ios:
    name: Submit iOS to App Store Connect
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
