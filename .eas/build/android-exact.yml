# Experimental: build the Exact Android app (a release APK) on EAS Build with
# plain shell steps, like ios-exact.yml. Exact's own script builds the APK
# (Rust for aarch64-linux-android, then Gradle).
#
# Run so far: `eas build -p android -e android-exact --local` on a Mac (exit 0,
# 16 MB APK, debug-signed). Not run on EAS's cloud workers yet.
#
# Open points:
#  - Signing: Exact's Gradle shell signs the release APK with the debug key
#    (host/android/app/build.gradle.kts). That APK installs on a device but is
#    not valid for Google Play. Play needs an upload keystore from EAS
#    (eas.job.secrets.buildCredentials) and a bundle or a re-signed APK.
#  - Platform 37.2 and the NDK: Gradle downloads parts if licences are
#    accepted; the worker image may not carry them.
#  - The Exact commit comes from .exact-ref at the repo root.
build:
  name: Exact Android (APK)
  steps:
    - eas/checkout

    # A workflow build job starts without a resolved version code:
    # eas/resolve_build_config fills in eas.job (version.versionCode). eas-cli
    # needs expo-modules-autolinking from node_modules to read the app config.
    # (A build started with `eas build` resolves it on the laptop instead.)
    - eas/install_node_modules
    - eas/resolve_build_config

    - run:
        name: Exact checkout and Rust
        command: |
          set -euo pipefail
          EXACT_REF=$(tr -d '[:space:]' < .exact-ref)
          mkdir -p ../exact && cd ../exact
          git init -q && git remote add origin https://github.com/expo/exact.git
          git fetch -q --depth 1 origin "$EXACT_REF" && git checkout -q FETCH_HEAD
          PIN=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          # Exact pins its Bun (packageManager in its package.json). An older Bun
          # cannot read Exact's bun.lock ("lockfile had changes"), so install the
          # pin (the worker image may already have it).
          BUN_PIN=$(sed -n -E 's/.*"packageManager"[[:space:]]*:[[:space:]]*"bun@([0-9.]+)".*/\1/p' package.json | head -n 1)
          test -n "$BUN_PIN" || { echo "No packageManager bun@x.y.z in Exact's package.json" >&2; exit 1; }
          # Installed beside any other Bun, in the folder Exact's launcher looks in.
          BUN_HOME="$HOME/.bun-$BUN_PIN"
          if [ ! -x "$BUN_HOME/bin/bun" ]; then
            curl -fsSL https://bun.sh/install | BUN_INSTALL="$BUN_HOME" bash -s "bun-v$BUN_PIN"
          fi
          export PATH="$BUN_HOME/bin:$PATH"
          # Exact's Gradle shell needs JDK 17 or newer.
          java -version 2>&1 | head -n 1 | grep -q -E '"(1[7-9]|[2-9][0-9])\.' || { echo "JDK 17+ is required" >&2; java -version >&2; exit 1; }
          if ! command -v rustup >/dev/null; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install "$PIN" --profile minimal --target aarch64-linux-android
          set-env PATH "$PATH"
          bun --version
          java -version

    - run:
        name: Exact setup (Bun deps, Android Hermes bundle, crates)
        command: |
          set -euo pipefail
          cd ../exact
          bun install --frozen-lockfile
          cargo run --locked --manifest-path vendor/ibex/crates/hermes-lean-sys-installer/Cargo.toml -- --target aarch64-linux-android
          cargo fetch --locked

    # Exact compiles against Android platform 37.2 and tries NDK 27.1 first. The
    # worker image may not carry them, so install what is missing (68 MB for the
    # platform). Licences are accepted for the SDK parts Gradle fetches.
    - run:
        name: Android SDK platform and NDK
        command: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}  ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then SDKM="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1 || true)"; fi
          if [ -z "$SDKM" ]; then
            echo "No sdkmanager found. SDK folder ($SDK) holds:" >&2
            ls -la "$SDK" >&2 || true
            exit 1
          fi
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDKM" --sdk_root="$SDK" "platforms;android-37.2" "ndk;27.1.12297006"
          ls "$SDK/platforms" "$SDK/ndk"
          set-env ANDROID_HOME "$SDK"

    # Exact's Android host fixes versionCode = 1 in build.gradle.kts and reads
    # no variable for it (iOS reads EXACT_BUILD_NUMBER). Until it does, write
    # the number EAS manages into the checkout, and fail if the line is gone.
    - run:
        name: Set the version code (EAS remote version)
        inputs:
          version_code: ${ eas.job.version.versionCode }
        command: |
          set -euo pipefail
          GRADLE=../exact/host/android/app/build.gradle.kts
          CODE="${ inputs.version_code }"
          case "$CODE" in ''|*[!0-9]*) echo "Version code is not a number: '$CODE'" >&2; exit 1;; esac
          test "$(grep -c '^        versionCode = 1$' "$GRADLE")" = 1 || { echo "versionCode line not found once in $GRADLE" >&2; exit 1; }
          sed -i.bak "s/^        versionCode = 1$/        versionCode = $CODE/" "$GRADLE" && rm "$GRADLE.bak"
          echo "versionCode = $CODE"

    - run:
        name: Build the APK
        command: |
          set -euo pipefail
          export EXACT_FEEDBACK=0 CARGO_INCREMENTAL=0
          # The EAS worker's ~/.gradle/init.gradle adds a Maven repository to every
          # project, and Exact's settings.gradle.kts refuses project repositories
          # (FAIL_ON_PROJECT_REPOS). A Gradle home of our own skips that script.
          export GRADLE_USER_HOME="$HOME/.gradle-exact"
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/android-sdk}"
          # NDK 27.1.12297006 is the one Exact tries first. Platform 37.2
          # (compileSdk) must be installed: sdkmanager "platforms;android-37.2"
          # (68 MB). The local build needed no other SDK part.
          bun exact.mjs android --release
          ls -lh target/android/app/outputs/apk/release/app-release.apk

    - eas/upload_artifact:
        name: Upload the APK
        inputs:
          type: application-archive
          path: target/android/app/outputs/apk/release/app-release.apk
