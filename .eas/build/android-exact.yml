# Build the Exact Android app (a release APK) on EAS Build with plain shell
# steps, following Exact's EAS Android recipe (docs/recipes/eas-android.md in
# the Exact commit named by .exact-ref). Exact's script builds the APK (Rust for
# aarch64-linux-android, then Gradle) and reads EXACT_BUILD_NUMBER and
# EXACT_VERSION for versionCode and versionName. The APK is signed with the
# debug key: it installs on a device but Google Play does not take it. The
# Play build is android-exact-store.yml.
#
# Production update trust needs either update signing keys or no Exact
# updates; app.json sets deploy.store.linux to "0" (no updates).
build:
  name: Exact Android (APK)
  steps:
    - eas/checkout

    # A workflow build job starts without a resolved version code:
    # eas/resolve_build_config fills in eas.job. eas-cli needs
    # expo-modules-autolinking from node_modules to read the app config.
    - eas/install_node_modules
    - eas/resolve_build_config

    # Cache: only entries that name the Exact commit, the app's lockfile and the
    # build mode. No fallback key: a cache from another Exact commit is never
    # restored. A hit saves the crates.io compiles, not the path crates (Cargo
    # may still rebuild those, as the checkout gets new file times). A clean
    # build works without any of this.
    - eas/restore_cache:
        inputs:
          key: exact-android-v3-apk-${ hashFiles('.exact-ref', 'Cargo.lock') }
          path: |
            ${ eas.env.HOME }/workingdir/target-pack
            ${ eas.env.HOME }/.cargo/registry
            ${ eas.env.HOME }/.cargo/git
            ${ eas.env.HOME }/.cargo/hermes-lean-sys
            ${ eas.env.HOME }/.rustup/toolchains

    # eas/save_cache skips folders that start with a dot, so the .fingerprint folders
    # of Cargo's target dirs were never saved and Cargo rebuilt every crate. The
    # target dirs travel as one tar file instead.
    - run:
        name: Unpack the saved target folders
        command: |
          PACK="$HOME/workingdir/target-pack/targets.tar"
          if [ -f "$PACK" ]; then tar -C "$HOME/workingdir" -xf "$PACK" && echo "Unpacked $(du -h "$PACK" | cut -f1)"; else echo "No saved target folders"; fi

    - run:
        name: Prepare Exact (checkout, Bun deps, Rust, Hermes)
        shell: /bin/sh
        command: sh .ci/prepare-native.sh android

    # The image may lack these. The setup check below names what is missing.
    - run:
        name: Android SDK platform, build-tools and NDK
        command: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then SDKM="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1 || true)"; fi
          [ -n "$SDKM" ] || { echo "No sdkmanager under $SDK" >&2; ls -la "$SDK" >&2 || true; exit 1; }
          yes | "$SDKM" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDKM" --sdk_root="$SDK" "platforms;android-37.2" "build-tools;37.0.0" "ndk;27.1.12297006"
          set-env ANDROID_HOME "$SDK"

    - run:
        name: Build
        command: |
          set -euo pipefail
          export EXACT_FEEDBACK=0 CARGO_INCREMENTAL=0
          bun "$EXACT/scripts/exact.mjs" setup --check --platform android
          # EAS remote versioning resolves the next number before the job
          # starts. EXACT_VERSION comes from the profile's env in eas.json.
          export EXACT_BUILD_NUMBER="${ eas.job.version.versionCode }"
          echo "Version code: $EXACT_BUILD_NUMBER  Version name: $EXACT_VERSION"
          export EXACT_UPDATE_TRUST=production
          bun exact.mjs android --release --no-install --json > artifact.json
          cat artifact.json
          ls -lh target/android/app/outputs/apk/release/app-release.apk

    # Every path must exist before saving, or the whole save aborts.
    - run:
        name: Pack the target folders and create the cache folders
        command: |
          mkdir -p "$HOME/workingdir/target-pack" "$HOME/.cargo/registry" "$HOME/.cargo/git" "$HOME/.cargo/hermes-lean-sys" "$HOME/.rustup/toolchains"
          tar -C "$HOME/workingdir" -cf "$HOME/workingdir/target-pack/targets.tar" $(cd "$HOME/workingdir" && ls -d build/target exact/target 2>/dev/null)
          du -h "$HOME/workingdir/target-pack/targets.tar"
    - eas/save_cache:
        if: ${ success() }
        inputs:
          key: exact-android-v3-apk-${ hashFiles('.exact-ref', 'Cargo.lock') }
          path: |
            ${ eas.env.HOME }/workingdir/target-pack
            ${ eas.env.HOME }/.cargo/registry
            ${ eas.env.HOME }/.cargo/git
            ${ eas.env.HOME }/.cargo/hermes-lean-sys
            ${ eas.env.HOME }/.rustup/toolchains

    - eas/upload_artifact:
        inputs:
          type: application-archive
          path: target/android/app/outputs/apk/release/app-release.apk
