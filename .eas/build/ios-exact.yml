# Experimental: build the Exact iOS app on EAS Build with plain shell steps.
# No eas/build, no prebuild, no node_modules: Exact's own script makes the .ipa.
# Mirrors .github/workflows/ios.yml. EXACT_REF must match that workflow's pin.
# Caches: eas/save_build_cache in a build job only saves ccache and CocoaPods
# (it ignores key and path), so this uses the generic eas/save_cache and
# eas/restore_cache. Each build saves under its own build id and the next one
# restores the newest entry by prefix. The save runs even when the build fails.
# The paths are absolute: the project is checked out at ~/workingdir/build.
build:
  name: Exact iOS (unsigned .ipa)
  steps:
    - eas/checkout

    - run:
        name: Exact checkout and Rust
        command: |
          set -euo pipefail
          EXACT_REF=1bdedcb30ffcb3a1dd8a181ba4ac16cb4f41ce19
          xcodebuild -version
          echo "Project dir: $PWD"
          # The app's Cargo.toml patches crates from ../exact/vendor, so Exact sits beside the app.
          mkdir -p ../exact && cd ../exact
          git init -q && git remote add origin https://github.com/expo/exact.git
          git fetch -q --depth 1 origin "$EXACT_REF" && git checkout -q FETCH_HEAD
          git log --oneline -1
          PIN=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          if ! command -v rustup >/dev/null; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install "$PIN" --profile minimal --target aarch64-apple-ios,aarch64-apple-ios-sim
          rustc "+$PIN" --version
          set-env PATH "$PATH"
                    bun --version

    - eas/restore_cache:
        name: Restore Rust and Exact caches
        inputs:
          key: exact-ios-1bdedcb3-none
          restore_keys: exact-ios-1bdedcb3-
          path: |
            ${ eas.env.HOME }/workingdir/build/target
            ${ eas.env.HOME }/workingdir/exact/target
            ${ eas.env.HOME }/.cargo/hermes-lean-sys
            ${ eas.env.HOME }/.cargo/registry
            ${ eas.env.HOME }/.cache/exact

    - run:
        name: Exact setup (Bun deps, Hermes bundles, crates)
        command: |
          set -euo pipefail
          cd ../exact
          bun install --frozen-lockfile
          for t in aarch64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim; do
            cargo run --locked --manifest-path vendor/ibex/crates/hermes-lean-sys-installer/Cargo.toml -- --target "$t"
          done
          cargo fetch --locked

    - run:
        name: Build unsigned device .ipa
        command: |
          set -euo pipefail
          export EXACT_FEEDBACK=0 CARGO_INCREMENTAL=0
          bun exact.mjs ios --device --archive "$PWD/out.ipa" --unsigned
          ls -lh out.ipa

    - eas/save_cache:
        name: Save Rust and Exact caches
        if: ${ always() }
        inputs:
          key: exact-ios-1bdedcb3-${ eas.env.EAS_BUILD_ID }
          path: |
            ${ eas.env.HOME }/workingdir/build/target
            ${ eas.env.HOME }/workingdir/exact/target
            ${ eas.env.HOME }/.cargo/hermes-lean-sys
            ${ eas.env.HOME }/.cargo/registry
            ${ eas.env.HOME }/.cache/exact

    # TEMPORARY probe (one build only): prove the cache round-trips and time a warm build.
    - run:
        name: Probe - wipe cached dirs and make sources look freshly checked out
        command: |
          set -euo pipefail
          du -sh ~/workingdir/build/target ~/workingdir/exact/target ~/.cargo/hermes-lean-sys ~/.cargo/registry ~/.cache/exact 2>/dev/null || true
          rm -rf ~/workingdir/build/target ~/workingdir/exact/target ~/.cargo/hermes-lean-sys ~/.cargo/registry ~/.cache/exact
          find ~/workingdir/build ~/workingdir/exact -path '*/node_modules' -prune -o -path '*/.git' -prune -o -type f -exec touch {} +
          mv out.ipa first.ipa
    - eas/restore_cache:
        name: Probe - restore this build's cache
        inputs:
          key: exact-ios-1bdedcb3-${ eas.env.EAS_BUILD_ID }
          path: |
            ${ eas.env.HOME }/workingdir/build/target
            ${ eas.env.HOME }/workingdir/exact/target
            ${ eas.env.HOME }/.cargo/hermes-lean-sys
            ${ eas.env.HOME }/.cargo/registry
            ${ eas.env.HOME }/.cache/exact
    - run:
        name: Probe - warm rebuild
        command: |
          set -euo pipefail
          export EXACT_FEEDBACK=0 CARGO_INCREMENTAL=0
          START=$(date +%s)
          bun exact.mjs ios --device --archive "$PWD/out.ipa" --unsigned
          echo "PROBE warm rebuild seconds: $(( $(date +%s) - START ))"
          ls -lh out.ipa first.ipa

    - eas/upload_artifact:
        name: Upload unsigned .ipa
        inputs:
          type: application-archive
          path: out.ipa
