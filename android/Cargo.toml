[package]
name = "exact-solar-trial-android"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[lib]
crate-type = ["cdylib"]
test = false
bench = false

[target.'cfg(target_os = "android")'.dependencies]
exact-logic = { path = "../.exact/checkout/logic" }
exact-linux = { path = "../.exact/checkout/host/linux" }
exact-painted = { path = "../.exact/checkout/host/painted" }
exact-js = { path = "../.exact/checkout/js" }

[build-dependencies]
exact-js-bake = { path = "../.exact/checkout/js/bake" }

[target."cfg(target_os = \"android\")".dependencies.ibex2-sqlite]
path = "../.exact/checkout/vendor/ibex/crates/ibex2-sqlite"
