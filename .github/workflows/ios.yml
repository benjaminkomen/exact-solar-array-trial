# Build the Exact iOS app on a GitHub-hosted Mac.
#
# EAS Build expects a React Native project. Exact is not one: its iOS app is
# produced by Exact's own script (bun exact.mjs ios), which needs Rust, Bun
# and Xcode. This workflow is the workaround: a macos runner, Exact's tooling,
# an unsigned device .ipa (ad-hoc signed, for a service that re-signs it) and
# a Simulator .app. There are no Apple signing secrets.
#
# Exact is pre-alpha and changes daily. EXACT_REF pins the commit this repo
# was last built against. Bump it when you update the Exact checkout.
name: iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.contract"
      - "app.ts"
      - "app.json"
      - "app.test.contract"
      - "assets/**"
      - "gpu/**"
      - "apple/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "exact.mjs"
      - "package.json"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  # github.com/expo/exact @ 2026-11-10 (the checkout the web demo was built with)
  EXACT_REF: 1bdedcb30ffcb3a1dd8a181ba4ac16cb4f41ce19
  BUN_VERSION: "1.4.2"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  EXACT_FEEDBACK: "0"

jobs:
  ios:
    # Exact's own CI uses macos-26, but that image's default Xcode cannot
    # compile Exact's Swift host (UIArrangementViewController and newer
    # AVAudioSession APIs). GitHub's xcode-27 image is the one that ships
    # those SDKs. Exact does not build iOS apps in its own CI.
    runs-on: xcode-27
    timeout-minutes: 120
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout this app
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout Exact
        uses: actions/checkout@v4
        with:
          repository: expo/exact
          ref: ${{ env.EXACT_REF }}
          path: exact

      - name: Show Xcode
        id: xcode
        working-directory: ${{ github.workspace }}
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphonesimulator --show-sdk-path
          version=$(xcodebuild -version | awk 'NR==1 { print $2 }')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Rust (Exact's rust-toolchain.toml)
        working-directory: exact
        run: |
          rustup show active-toolchain || rustup toolchain install
          PIN=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim --toolchain "$PIN"
          echo "PINNED_RUST=$PIN" >> "$GITHUB_ENV"
          rustc "+$PIN" --version
          rustup target list --installed --toolchain "$PIN"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Cargo's downloaded crates and exact/target (the Hermes installer).
      # The key is not the old `xcode-27` one: that archive also held a pruned
      # copy of app/target, and restoring it after the full target below would
      # put the pruned tree back. The app's compiled tree is the next step.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: exact
          prefix-key: ios-${{ env.EXACT_REF }}
          key: xcode-27-registry
          cache-on-failure: true

      # docs/reference.md, "Build an iOS app on a CI machine": keeping the
      # app's target/ and ~/.cache/exact between runs is what turns a cold
      # build of tens of minutes into minutes. target/ holds the Rust and the
      # Swift host (apple-swift, apple-modules). ~/.cache/exact holds the
      # machine copies (apple-modules, apple-crates) a fresh target reads.
      # The key is the pinned Exact commit, the Xcode this image actually
      # selected, and the app's Cargo.lock. A lockfile change may reuse the
      # same commit and Xcode; a different Xcode does not.
      - name: Cache app target and Exact's Apple cache
        uses: actions/cache@v4
        with:
          path: |
            app/target
            ~/.cache/exact
          key: ios-${{ env.EXACT_REF }}-xcode-${{ steps.xcode.outputs.version }}-${{ hashFiles('app/Cargo.lock') }}
          restore-keys: |
            ios-${{ env.EXACT_REF }}-xcode-${{ steps.xcode.outputs.version }}-

      # Restore/save are split so a failed build still writes the Hermes cache.
      # actions/cache's post step is skipped on failure, which left the first
      # two runs reinstalling the bundles each time.
      - name: Restore Hermes bundles
        id: hermes-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/hermes-lean-sys
          key: hermes-${{ env.EXACT_REF }}-${{ runner.os }}-aarch64-apple-ios-sim

      - name: Bun dependencies
        working-directory: exact
        run: bun install --frozen-lockfile

      # Targeted setup: the full `bun scripts/exact.mjs setup` also installs
      # the web/game toolchain (nightly Rust, wasm-bindgen, Binaryen, Chrome).
      # An iOS TypeScript app only needs the host and iOS Hermes bundles,
      # installed the way Exact's README describes.
      - name: Hermes bundles
        working-directory: exact
        run: |
          install() {
            cargo run --locked --manifest-path vendor/ibex/crates/hermes-lean-sys-installer/Cargo.toml -- --target "$1"
          }
          install aarch64-apple-darwin
          install aarch64-apple-ios
          install aarch64-apple-ios-sim

      - name: Save Hermes bundles
        if: always() && steps.hermes-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cargo/hermes-lean-sys
          key: hermes-${{ env.EXACT_REF }}-${{ runner.os }}-aarch64-apple-ios-sim

      - name: Cargo crates
        working-directory: exact
        run: cargo fetch --locked

      - name: Build unsigned device .ipa
        run: |
          mkdir -p artifacts
          bun exact.mjs ios --device --archive "$PWD/artifacts/ExactSolarTrial.ipa" --unsigned
          ls -lh artifacts

      - name: Build iOS Simulator .app
        run: |
          bun exact.mjs ios --no-install 2>&1 | tee /tmp/ios-sim.log
          BUNDLE=$(sed -n 's/^host\/apple: \(.*\.app\) (.*/\1/p' /tmp/ios-sim.log | tail -1)
          if [ -z "$BUNDLE" ] || [ ! -d "$BUNDLE" ]; then
            echo "Could not find the Simulator .app from the build log." >&2
            find target -name '*.app' -type d -print >&2 || true
            exit 1
          fi
          echo "Simulator app: $BUNDLE"
          ditto -c -k --keepParent "$BUNDLE" artifacts/ExactSolarTrial-simulator.app.zip
          ls -lh artifacts

      - name: Upload unsigned .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ExactSolarTrial-ios-ipa
          path: |
            app/artifacts/ExactSolarTrial.ipa
            app/artifacts/ExactSolarTrial.receipt.json
            app/artifacts/ExactSolarTrial.dSYM
            app/artifacts/ExactSolarTrial.dSYMs
          if-no-files-found: error
          retention-days: 14

      - name: Upload Simulator .app
        uses: actions/upload-artifact@v4
        with:
          name: ExactSolarTrial-ios-simulator
          path: app/artifacts/ExactSolarTrial-simulator.app.zip
          if-no-files-found: error
          retention-days: 14
