# Runs the app's tests on every pull request: the UI tests in app.test.contract
# (bun exact.mjs test web) and the roof GPU readback test.
# It uses GitHub's Linux runner, so it spends no EAS builds.
#
# .cursor/install.sh sets up the Linux toolchain from the Exact commit in
# .exact-ref and ends by running `bun exact.mjs test web`.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  EXACT_FEEDBACK: "0"

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Where install.sh puts Exact
        run: echo "EXACT_DIR=$(dirname "$GITHUB_WORKSPACE")/exact" >> "$GITHUB_ENV"

      # Cargo's build output (Exact's target/ and this app's), the downloaded
      # crates, toolchains, Hermes bundles and wasm-bindgen. install.sh puts the
      # Exact checkout beside this one and sets its file times to its commit
      # time (scripts/normalize-mtimes.sh), so the restored target/ stays fresh.
      - name: Restore caches
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.EXACT_DIR }}/target
            ${{ github.workspace }}/target
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/hermes-lean-sys
            ~/.cargo/bin/wasm-bindgen
            ~/.cache/exact/binaryen
            ~/.cache/exact/web-modules
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
          # No restore-keys: a cache from another Exact commit must not restore.
          # install.sh sets Exact's file times to its commit time, so a restored
          # target/ built from different sources could look fresh to Cargo.
          key: tests-${{ runner.os }}-${{ hashFiles('.exact-ref', 'Cargo.lock') }}

      # Chrome sometimes does not answer within 15 s on the first start of a run
      # that restored a large cache (two failures, and the rerun of one passed).
      # The second pass is quick: everything is already installed and built.
      - name: Toolchain, then UI tests (bun exact.mjs test web)
        run: |
          bash .cursor/install.sh || {
            echo "::warning::The first pass failed. Retrying once."
            bash .cursor/install.sh
          }

      # No GPU on the runner: Chrome's bundled SwiftShader is the Vulkan driver.
      # The test skips when it finds no adapter, so the step then checks that
      # the pictures it saves exist.
      - name: Roof GPU test (SwiftShader)
        env:
          VK_ICD_FILENAMES: /opt/google/chrome/vk_swiftshader_icd.json
          LD_LIBRARY_PATH: /opt/google/chrome
          EXACT_GPU_OUT: ${{ runner.temp }}/gpu
        run: |
          sudo apt-get install -y libvulkan1
          mkdir -p "$EXACT_GPU_OUT"
          cargo test --locked -p exact-solar-trial-gpu
          ls "$EXACT_GPU_OUT"/roof-noon* "$EXACT_GPU_OUT"/roof-dusk*

      # Saved only after a green run. A cancelled or failed run saved a half-full
      # cache under this key, and a saved key is never replaced, so every later
      # run restored that thin cache.
      - name: Save caches
        if: success() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.EXACT_DIR }}/target
            ${{ github.workspace }}/target
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/hermes-lean-sys
            ~/.cargo/bin/wasm-bindgen
            ~/.cache/exact/binaryen
            ~/.cache/exact/web-modules
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
          key: tests-${{ runner.os }}-${{ hashFiles('.exact-ref', 'Cargo.lock') }}
